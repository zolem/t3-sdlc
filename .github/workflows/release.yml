name: release

# Tag vX.Y.Z → test, pack, and publish a GitHub release with t3-sdlc.tar.gz and install.sh.
# Users install the latest with:
#   curl -fsSL https://github.com/<owner>/<repo>/releases/latest/download/install.sh | sh

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test
        working-directory: factory
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          npm ci
          npm test
          npm run typecheck

      - name: Pack
        run: sh scripts/pack.sh "${{ github.ref_name }}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: t3-sdlc ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/t3-sdlc.tar.gz
            dist/install.sh
